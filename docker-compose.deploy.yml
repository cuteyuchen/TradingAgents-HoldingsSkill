services:
  advisor:
    image: ghcr.io/${GHCR_OWNER:-cuteyuchen}/tradingagents-holdings-advisor:${IMAGE_TAG:-latest}
    container_name: tradingagents-holdings-advisor
    environment:
      - APP_VERSION=${APP_VERSION:-0.3.0}
      - APP_GIT_SHA=${APP_GIT_SHA:-UNKNOWN}
      - APP_BUILD_TIME=${APP_BUILD_TIME:-unknown}
      - ADVISOR_TOKEN=${ADVISOR_TOKEN}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - JWT_ACCESS_TOKEN_MINUTES=${JWT_ACCESS_TOKEN_MINUTES:-15}
      - JWT_REFRESH_TOKEN_DAYS=${JWT_REFRESH_TOKEN_DAYS:-30}
      - ADVISOR_DB_PATH=/app/data/advisor.db
      - ADVISOR_ARTIFACTS_DIR=/app/data/artifacts
      - ADVISOR_BACKUP_DIR=/app/data/backups
      - ADVISOR_SQLITE_JOURNAL_MODE=${ADVISOR_SQLITE_JOURNAL_MODE:-WAL}
      - ADVISOR_CORS_ORIGINS=${ADVISOR_CORS_ORIGINS:-http://localhost:8080}
      - MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES:-12582912}
      - ANALYSIS_HISTORY_LIMIT=${ANALYSIS_HISTORY_LIMIT:-5}
      # 模型调用超时：流式模式下 READ_TIMEOUT 只约束数据块之间的静默间隔
      - MODEL_CONNECT_TIMEOUT=${MODEL_CONNECT_TIMEOUT:-15}
      - MODEL_READ_TIMEOUT=${MODEL_READ_TIMEOUT:-600}
      - MODEL_STREAM_IDLE_TIMEOUT=${MODEL_STREAM_IDLE_TIMEOUT:-180}
      - MODEL_STREAM_DEFAULT=${MODEL_STREAM_DEFAULT:-true}
      - MODEL_MAX_RETRIES=${MODEL_MAX_RETRIES:-1}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-true}
      - SCHEDULER_INTERVAL_SECONDS=${SCHEDULER_INTERVAL_SECONDS:-60}
      - WEB_CONCURRENCY=1
      - BACKUP_SCHEDULE_ENABLED=${BACKUP_SCHEDULE_ENABLED:-true}
      - BACKUP_SCHEDULE_TIME=${BACKUP_SCHEDULE_TIME:-20:45}
      - BACKUP_RETENTION_DAILY=${BACKUP_RETENTION_DAILY:-7}
      - BACKUP_RETENTION_WEEKLY=${BACKUP_RETENTION_WEEKLY:-4}
      - BACKUP_RETENTION_PRE_UPGRADE=${BACKUP_RETENTION_PRE_UPGRADE:-5}
      - DISK_DEGRADED_RATIO=${DISK_DEGRADED_RATIO:-0.10}
      - DISK_BLOCKED_RATIO=${DISK_BLOCKED_RATIO:-0.03}
      - DIAGNOSTIC_LOG_LINES=${DIAGNOSTIC_LOG_LINES:-2000}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8080}
      - MARKET_QUOTE_ALL_A_PRIMARY_PROVIDER=${MARKET_QUOTE_ALL_A_PRIMARY_PROVIDER:-eastmoney_batch}
      - MARKET_QUOTE_ALL_A_FALLBACK_PROVIDERS=${MARKET_QUOTE_ALL_A_FALLBACK_PROVIDERS:-tencent}
      - MARKET_QUOTE_CRITICAL_PRIMARY_PROVIDER=${MARKET_QUOTE_CRITICAL_PRIMARY_PROVIDER:-tencent}
      - MARKET_QUOTE_CRITICAL_FALLBACK_PROVIDERS=${MARKET_QUOTE_CRITICAL_FALLBACK_PROVIDERS:-eastmoney_batch}
      - PROVIDER_FAILURE_THRESHOLD=${PROVIDER_FAILURE_THRESHOLD:-3}
      - PROVIDER_CIRCUIT_COOLDOWN_SECONDS=${PROVIDER_CIRCUIT_COOLDOWN_SECONDS:-60}
      - QUOTE_FRESHNESS_SECONDS=${QUOTE_FRESHNESS_SECONDS:-90}
      - MARKET_SNAPSHOT_FRESHNESS_SECONDS=${MARKET_SNAPSHOT_FRESHNESS_SECONDS:-120}
      - MARKET_QUOTE_CONFLICT_THRESHOLD_PCT=${MARKET_QUOTE_CONFLICT_THRESHOLD_PCT:-0.5}
      - EASTMONEY_MIN_INTERVAL_SECONDS=${EASTMONEY_MIN_INTERVAL_SECONDS:-0.8}
      - SECURITY_MASTER_SYNC_ENABLED=${SECURITY_MASTER_SYNC_ENABLED:-false}
      - CALENDAR_SYNC_ENABLED=${CALENDAR_SYNC_ENABLED:-false}
      - CALENDAR_BOOTSTRAP_ENABLED=${CALENDAR_BOOTSTRAP_ENABLED:-true}
      - CALENDAR_SYNC_PROVIDER=${CALENDAR_SYNC_PROVIDER:-eastmoney_sse_calendar}
      - CALENDAR_SYNC_LOOKBACK_DAYS=${CALENDAR_SYNC_LOOKBACK_DAYS:-370}
      - SECURITY_MASTER_SYNC_PROVIDER=${SECURITY_MASTER_SYNC_PROVIDER:-eastmoney_security}
      - MARKET_IDENTITY_SYNC_TOKEN=${MARKET_IDENTITY_SYNC_TOKEN:-}
      - HOLDINGS_SKILL_DIR=/app/skill/tradingagents-holdings-advisor
    volumes:
      - ./backend/data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
      - "${FRONTEND_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
